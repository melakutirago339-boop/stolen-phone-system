<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የተሰረቀ ስልክ ሪፖርት</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 30px;
            direction: rtl;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            direction: rtl;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #dc3545;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #bb2d3b;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📱 የተሰረቀ ስልክ ሪፖርት</h1>

    {% if success %}
        <div class="success">
            {{ success }}
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/report">

        <label>የባለቤቱ ስም</label>
        <input type="text" name="owner_name" required>

        <label>የስልክ ቁጥር</label>
        <input type="text" name="phone_number">

        <label>የስልክ ሞዴል</label>
        <input type="text" name="phone_model">

        <label>IMEI ቁጥር</label>
        <input type="text" name="imei" required>

        <label>የተሰረቀበት ቀን</label>
        <input type="date" name="date_stolen">

        <label>የተሰረቀበት ቦታ</label>
        <input type="text" name="location">

        <label>ተጨማሪ መግለጫ</label>
        <textarea name="description"></textarea>

        <button type="submit">
            🚨 የስርቆት ሪፖርት አስገባ
        </button>

    </form>

    <a class="back" href="/dashboard">
        ← ወደ Dashboard ተመለስ
    </a>

</div>

</body>
</html>
